name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REDIS_URL: redis://localhost:6379
  REDIS_CLUSTER_NODES: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003,127.0.0.1:7004,127.0.0.1:7005
  TOKEN_SERVICE_POSTGRES_URL: postgres://blockend:blockend@localhost:5432/blockend_test

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: blockend
          POSTGRES_PASSWORD: blockend
          POSTGRES_DB: blockend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockend -d blockend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec next typegen
      - name: Start Redis Cluster for token-service integration tests
        run: |
          for port in 7000 7001 7002 7003 7004 7005; do
            docker run -d --name "blockend-redis-$port" --network host redis:7 \
              redis-server --port "$port" --cluster-enabled yes \
              --cluster-config-file "nodes-$port.conf" --cluster-node-timeout 5000 \
              --cluster-announce-ip 127.0.0.1 --cluster-announce-port "$port" \
              --cluster-announce-bus-port "$((port + 10000))" \
              --appendonly yes --maxmemory-policy noeviction
          done
          for port in 7000 7001 7002 7003 7004 7005; do
            for attempt in {1..30}; do
              if docker exec "blockend-redis-$port" redis-cli ping >/dev/null 2>&1; then break; fi
              sleep 1
            done
            docker exec "blockend-redis-$port" redis-cli ping
          done
          docker run --rm --network host redis:7 redis-cli --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
            127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 \
            --cluster-replicas 1 --cluster-yes
      - run: pnpm validate
