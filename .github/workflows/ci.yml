name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REDIS_URL: redis://localhost:6379
  TOKEN_SERVICE_POSTGRES_URL: postgres://blockend:blockend@localhost:5432/blockend_test

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: blockend
          POSTGRES_PASSWORD: blockend
          POSTGRES_DB: blockend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockend -d blockend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec next typegen
      - run: pnpm validate
