name: Release CLI

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PACKAGE_DIR: packages/cli

jobs:
  release:
    name: Release CLI to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js with npm provenance
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck CLI
        run: pnpm --filter blockend-cli typecheck

      - name: Run CLI unit tests
        run: pnpm --filter blockend-cli test

      - name: Build CLI
        run: pnpm --filter blockend-cli build

      - name: Verify build output
        run: |
          echo "=== CLI package contents ==="
          ls -la packages/cli

          echo ""
          echo "=== dist contents ==="
          ls -la packages/cli/dist

      - name: CLI smoke tests
        run: |
          node packages/cli/dist/index.js --help > /dev/null
          node packages/cli/dist/index.js init --help > /dev/null
          node packages/cli/dist/index.js add --help > /dev/null
          node packages/cli/dist/index.js list --help > /dev/null
          node packages/cli/dist/index.js detect --help > /dev/null
          node packages/cli/dist/index.js diff --help > /dev/null
          node packages/cli/dist/index.js doctor --help > /dev/null
          node packages/cli/dist/index.js update --help > /dev/null
          node packages/cli/dist/index.js mcp --help > /dev/null

      - name: Validate release version
        run: |
          cd ${{ env.PACKAGE_DIR }}

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}

          echo "Package version: $PACKAGE_VERSION"
          echo "Release tag: $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch between package.json and release tag"
            exit 1
          fi

      - name: Validate package contents
        run: |
          cd ${{ env.PACKAGE_DIR }}

          echo "=== Current directory: $(pwd) ==="
          echo "=== Directory contents ==="
          ls -la

          echo ""
          echo "=== Verifying dist/index.js exists ==="
          if [ ! -f dist/index.js ]; then
            echo "ERROR: dist/index.js not found"
            echo "=== dist/ directory contents ==="
            ls -la dist/ || echo "dist/ directory does not exist"
            exit 1
          fi

          echo "=== Verifying dist/index.d.ts exists ==="
          if [ ! -f dist/index.d.ts ]; then
            echo "ERROR: dist/index.d.ts not found"
            echo "=== dist/ directory contents ==="
            ls -la dist/ || echo "dist/ directory does not exist"
            exit 1
          fi

          echo "=== Verifying README.md exists ==="
          if [ ! -f README.md ]; then
            echo "ERROR: README.md not found"
            exit 1
          fi

          echo "=== Verifying package.json ==="
          node -e "
          const p=require('./package.json');
          console.log('Package:', p.name);
          console.log('Version:', p.version);
          console.log('Bin:', p.bin);
          console.log('Files:', p.files.join(', '));
          console.log('Provenance:', p.publishConfig?.provenance);
          "

          echo ""
          echo "=== Dry-run npm pack ==="
          npm pack --dry-run

      - name: Publish to npm with provenance
        run: |
          cd ${{ env.PACKAGE_DIR }}
          npm publish --access public --provenance
          echo "Package published to npm with provenance"

      - name: Verify published package
        run: |
          echo "=== Published version ==="
          npm view blockend-cli version

          echo "=== Published tarball ==="
          npm view blockend-cli dist.tarball

          echo "=== Package metadata ==="
          npm view blockend-cli name version description
